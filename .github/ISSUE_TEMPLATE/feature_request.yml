name: Feature request
description: Suggest a focused improvement to Model Bench.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the use case without including private benchmark data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like and any alternatives considered.
    validations:
      required: true
